[project]
name = "talentlens-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "python-multipart==0.0.20",
    "pypdf==5.1.0",
    "python-docx==1.1.2",
    "openai==1.58.1",
    "google-generativeai==0.8.3",
    "httpx==0.28.1",
    "sqlalchemy[asyncio]==2.1.4",
    "psycopg[binary]==3.3.6",
    "beanie==2.2.0",
    "pyjwt==2.15.1",
    "bcrypt==5.0.0",
    "google-auth==2.49.2",
    "requests==2.33.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Lets `uv run pytest` import the `app` package from this directory.
pythonpath = ["."]

# Vercel (see vercel.json for the build command and function limits).
[tool.vercel]
entrypoint = "app.main:app"

# Serve the UI from the function rather than Vercel's CDN, so the UI shell
# keeps the headers the app sets (CSP, X-Frame-Options, Cache-Control).
[tool.vercel.fastapi.static]
cdn = false
