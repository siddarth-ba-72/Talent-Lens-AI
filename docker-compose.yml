services:
  postgres:
    image: postgres:16
    container_name: talentlens-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: talentlens
      POSTGRES_PASSWORD: talentlens
      POSTGRES_DB: talentlens

  mongo:
    image: mongo:7.0
    container_name: talentlens-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: talentlens
